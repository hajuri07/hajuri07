    <line x1="880" y1="90" x2="960" y2="60"/>
    <line x1="960" y1="60" x2="1050" y2="95"/>
    <line x1="880" y1="90" x2="930" y2="150"/>
    <line x1="930" y1="150" x2="1050" y2="95"/>
    <line x1="930" y1="150" x2="1000" y2="215"/>
    <line x1="1050" y1="95" x2="1120" y2="140"/>
    <line x1="1000" y1="215" x2="1120" y2="140"/>
    <line x1="1000" y1="215" x2="1080" y2="245"/>
